<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/typo-js@1.2.4/typo.min.js"></script>
</head>
<body>
    <div id="content" contenteditable="true">
        This is a tset to sea if it workss correcly.
    </div>
    <script>

            console.log(typo.check("test"));

            console.log(typo.check("workss"));
            console.log(typo.check("correcly"));
        }
        run();
